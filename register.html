<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دردشة فورية - إنشاء حساب</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">💬 إنشاء حساب جديد</h1>
      <p class="auth-subtitle">انضم إلى المحادثات</p>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input type="text" id="username" placeholder="اسمك هنا" required>
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <small class="hint">استخدم كلمة مرور مميزة للحصول على صلاحيات الأدمن</small>
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <button type="submit" class="btn btn-primary">إنشاء حساب</button>
      </form>

      <p class="auth-switch">لديك حساب بالفعل؟ <a href="/">سجّل دخولك</a></p>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
